name: WWJ CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "source/server-node/**"
      - "source/web/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

concurrency:
  group: server-node-production
  cancel-in-progress: false

jobs:
  ci:
    name: Test and build server-node
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'source/server-node/')

    defaults:
      run:
        working-directory: source/server-node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/server-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag wwjing-server-node:ci .

  cd:
    name: Deploy server-node
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -eu

            cd /root/baleine/wwjing
            git pull --ff-only origin main

            cd source/server-node
            test -f .env.production

            docker compose --env-file .env.production build --pull server-node
            docker compose --env-file .env.production run --rm server-node npm run db:migrate
            docker compose --env-file .env.production up -d --force-recreate server-node
            docker compose ps

  web-ci:
    name: Build web frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'source/web/')

    defaults:
      run:
        working-directory: source/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  web-cd:
    name: Deploy web frontend
    needs: web-ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -eu

            cd /root/baleine/wwjing
            git pull --ff-only origin main

            cd source/web
            npm ci
            npm run build

            mkdir -p nginx/html
            mkdir -p nginx/html-next
            rm -rf nginx/html-next/*
            cp -r dist/. nginx/html-next/
            rm -rf nginx/html/*
            cp -r nginx/html-next/. nginx/html/
            rm -rf nginx/html-next

            docker compose up -d --pull always
            docker compose ps
