name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "source/web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "source/web/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  ci:
    name: Build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: source/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package frontend
        run: tar -czf ../../web-dist.tar.gz -C dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz

  cd:
    name: Deploy frontend files
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: web-dist.tar.gz
          target: /tmp

      - name: Publish files to Nginx directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -eu

            target=/home/baleine/development/nginx/html/wwjing
            staging=/home/baleine/development/nginx/html/wwjing.next

            test -f /tmp/web-dist.tar.gz
            rm -rf "$staging"
            mkdir -p "$staging" "$target"
            tar -xzf /tmp/web-dist.tar.gz -C "$staging"
            find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$staging"/. "$target"/
            rm -rf "$staging" /tmp/web-dist.tar.gz
            test -f "$target/index.html"
