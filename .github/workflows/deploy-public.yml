name: Deploy public files

on:
  push:
    branches:
      - main
    paths:
      - "source/public/**"
      - ".github/workflows/deploy-public.yml"
  workflow_dispatch:

concurrency:
  group: deploy-public-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy public directory
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package public files
        run: tar -czf public-files.tar.gz -C source/public .

      - name: Upload public files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: public-files.tar.gz
          target: /tmp

      - name: Publish files to Nginx directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -eu

            archive=/tmp/public-files.tar.gz
            target=/home/baleine/development/nginx/html

            test -f "$archive"
            mkdir -p "$target"
            tar -xzf "$archive" -C "$target"
            rm -f "$archive"
            test -f "$target/halloween/index.html"
