name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "source/web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package frontend
        run: tar -czf ../../web-dist.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz

  deploy:
    name: Deploy frontend to Nginx
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: deploy-artifact

      - name: Upload artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deploy-artifact/web-dist.tar.gz
          target: /tmp

      - name: Publish artifact
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -eu

            target=/root/baleine/wwjing/source/web/nginx/html
            staging=/root/baleine/wwjing/source/web/nginx/html.next

            rm -rf "$staging"
            mkdir -p "$staging" "$target"
            tar -xzf /tmp/web-dist.tar.gz -C "$staging"
            find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$staging"/. "$target"/
            rm -rf "$staging" /tmp/web-dist.tar.gz

            if docker ps --format '{{.Names}}' | grep -qx 'wwjing-nginx'; then
              docker exec wwjing-nginx nginx -t
              docker exec wwjing-nginx nginx -s reload
            fi

            test -f "$target/index.html"
