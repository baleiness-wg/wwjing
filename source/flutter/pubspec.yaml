name: wwjing_bookmarks
description: "跨端私人收藏夹 Android 客户端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # REST API 请求。
  http: 1.5.0
  # Android Keystore 支持的 JWT 安全存储。
  flutter_secure_storage: 9.2.4
  # 最近目录及剪贴板去重等非敏感偏好。
  shared_preferences: 2.5.3
  # ChangeNotifier 状态注入。
  provider: 6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
