services:
  server-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wwjing-server-node
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "3000:3000"