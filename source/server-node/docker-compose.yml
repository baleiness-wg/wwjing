services:
  server-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wwjing-server-node
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
      NODE_OPTIONS: --dns-result-order=ipv4first
    ports:
      - "3000:3000"
    networks:
      - wwjing-network

networks:
  wwjing-network:
    external: true
