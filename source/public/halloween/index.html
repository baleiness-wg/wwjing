<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17111f">
  <title>今晚不宜 · 万圣节民间提醒</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #17111f;
      --paper: #f2e7d3;
      --acid: #c8ff45;
      --pumpkin: #ff7138;
      --purple: #8f66ff;
      --muted: #bcb0c7;
      --line: rgba(242, 231, 211, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--paper);
      background:
        radial-gradient(circle at 72% 18%, rgba(143, 102, 255, 0.22), transparent 28rem),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        var(--ink);
      background-size: auto, 32px 32px, 32px 32px, auto;
      font-family: "Arial Black", "Microsoft YaHei", sans-serif;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0.24;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, 0.18) 4px);
      mix-blend-mode: multiply;
    }

    button {
      font: inherit;
    }

    .page {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(1180px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 26px 0 20px;
    }

    .masthead,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-family: ui-monospace, "Microsoft YaHei", monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .eye-mark {
      display: grid;
      width: 32px;
      height: 22px;
      place-items: center;
      color: var(--ink);
      background: var(--acid);
      border-radius: 70% 18%;
      transform: rotate(45deg);
    }

    .eye-mark::after {
      content: "•";
      transform: rotate(-45deg);
      font-size: 23px;
      line-height: 1;
    }

    .status {
      color: var(--acid);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(360px, 0.92fr);
      align-items: center;
      gap: clamp(36px, 7vw, 100px);
      padding: 54px 0 44px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 8px 11px;
      color: var(--ink);
      background: var(--pumpkin);
      box-shadow: 5px 5px 0 var(--paper);
      font-family: ui-monospace, "Microsoft YaHei", monospace;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      transform: rotate(-1.5deg);
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(72px, 10vw, 148px);
      line-height: 0.82;
      letter-spacing: -0.085em;
    }

    h1 span {
      position: relative;
      display: block;
      width: max-content;
      max-width: 100%;
      color: var(--acid);
      text-shadow: 6px 6px 0 #4a2674;
      transform: translateX(0.14em);
    }

    h1 span::after {
      content: "今晚不宜";
      position: absolute;
      inset: 0;
      z-index: -1;
      color: var(--pumpkin);
      transform: translate(8px, -6px);
      clip-path: polygon(0 48%, 100% 37%, 100% 60%, 0 70%);
    }

    .intro {
      max-width: 530px;
      margin: 28px 0 0;
      color: var(--muted);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: clamp(16px, 2vw, 19px);
      font-weight: 600;
      line-height: 1.75;
    }

    .intro strong {
      color: var(--paper);
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 34px;
    }

    .primary-button,
    .text-button {
      cursor: pointer;
      border: 0;
    }

    .primary-button {
      position: relative;
      min-width: 220px;
      padding: 18px 26px;
      color: var(--ink);
      background: var(--acid);
      border: 2px solid var(--ink);
      box-shadow: 7px 7px 0 var(--pumpkin);
      font-size: 18px;
      letter-spacing: 0.04em;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .primary-button:hover {
      box-shadow: 3px 3px 0 var(--pumpkin);
      transform: translate(4px, 4px) rotate(-1deg);
    }

    .primary-button:active {
      box-shadow: 0 0 0 var(--pumpkin);
      transform: translate(7px, 7px);
    }

    .privacy-note {
      color: #877c91;
      font-family: ui-monospace, "Microsoft YaHei", monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .oracle-wrap {
      position: relative;
      display: grid;
      min-height: 540px;
      place-items: center;
    }

    .moon {
      position: absolute;
      top: 2%;
      right: 4%;
      width: min(25vw, 290px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--pumpkin);
      box-shadow: 0 0 80px rgba(255, 113, 56, 0.28);
    }

    .moon::before,
    .moon::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(23, 17, 31, 0.16);
    }

    .moon::before {
      top: 20%;
      left: 18%;
      width: 24%;
      height: 24%;
    }

    .moon::after {
      right: 18%;
      bottom: 18%;
      width: 15%;
      height: 15%;
    }

    .bat {
      position: absolute;
      z-index: 1;
      color: var(--ink);
      font-size: 34px;
      animation: drift 4.2s ease-in-out infinite alternate;
    }

    .bat-one {
      top: 15%;
      right: 30%;
      transform: rotate(-12deg);
    }

    .bat-two {
      top: 33%;
      right: 5%;
      font-size: 24px;
      animation-delay: -2s;
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(100%, 420px);
      min-height: 450px;
      padding: 24px;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 14px 14px 0 #5b3290, 17px 17px 0 var(--paper);
      transform: rotate(2.5deg);
      transition: transform 260ms ease;
    }

    .card::before {
      content: "私人迷信 / 请勿当真";
      position: absolute;
      top: 26px;
      right: -48px;
      padding: 6px 24px;
      color: var(--paper);
      background: var(--pumpkin);
      font-family: ui-monospace, "Microsoft YaHei", monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      transform: rotate(38deg);
    }

    .card.is-reading {
      animation: shake 420ms steps(2, end) 2;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--ink);
      font-family: ui-monospace, "Microsoft YaHei", monospace;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .signal::before {
      content: "";
      width: 9px;
      height: 9px;
      background: var(--pumpkin);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(255, 113, 56, 0.18);
      animation: blink 1.15s steps(1) infinite;
    }

    .result-label {
      margin: 34px 0 8px;
      font-family: ui-monospace, "Microsoft YaHei", monospace;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    .result-title {
      min-height: 120px;
      margin: 0;
      font-size: clamp(42px, 5vw, 64px);
      line-height: 1.03;
      letter-spacing: -0.06em;
    }

    .result-reason {
      min-height: 66px;
      margin: 22px 0;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.7;
    }

    .remedy {
      padding: 13px 15px;
      background: var(--acid);
      border: 2px solid var(--ink);
      font-family: ui-monospace, "Microsoft YaHei", monospace;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.55;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
    }

    .text-button {
      padding: 6px 0;
      color: var(--ink);
      background: transparent;
      border-bottom: 2px solid var(--ink);
      font-family: ui-monospace, "Microsoft YaHei", monospace;
      font-size: 12px;
      font-weight: 900;
    }

    .stamp {
      display: grid;
      width: 62px;
      height: 62px;
      place-items: center;
      color: var(--pumpkin);
      border: 4px double var(--pumpkin);
      border-radius: 50%;
      font-family: serif;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      transform: rotate(-14deg);
    }

    .footer {
      padding-top: 18px;
      color: #81758b;
      border-top: 1px solid var(--line);
    }

    .footer strong {
      color: var(--paper);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      z-index: 20;
      padding: 11px 16px;
      color: var(--ink);
      background: var(--acid);
      border: 2px solid var(--ink);
      font-family: ui-monospace, "Microsoft YaHei", monospace;
      font-size: 12px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 20px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes shake {
      0% { transform: rotate(2.5deg) translate(0); }
      25% { transform: rotate(-1deg) translate(-5px, 2px); }
      50% { transform: rotate(3deg) translate(5px, -2px); }
      75% { transform: rotate(0deg) translate(-2px, -4px); }
      100% { transform: rotate(2.5deg) translate(0); }
    }

    @keyframes drift {
      from { translate: -6px -3px; }
      to { translate: 10px 9px; }
    }

    @keyframes blink {
      50% { opacity: 0.25; }
    }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 30px, 620px);
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 18px;
        padding-top: 48px;
      }

      h1 {
        font-size: clamp(66px, 22vw, 112px);
      }

      .oracle-wrap {
        min-height: 570px;
      }

      .moon {
        width: 260px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {
      .masthead .status {
        display: none;
      }

      .action-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .primary-button {
        width: calc(100% - 7px);
      }

      .oracle-wrap {
        min-height: 530px;
      }

      .card {
        min-height: 430px;
        padding: 20px;
        transform: rotate(1deg);
      }

      .result-title {
        min-height: 105px;
        font-size: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <span class="eye-mark" aria-hidden="true"></span>
        <span>民间夜间事务所 / 2026</span>
      </div>
      <span class="status">● 今晚正常营业，但不太正常</span>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <span class="kicker">万圣节限定 · 不科学指南</span>
        <h1>今晚<span>不宜</span></h1>
        <p class="intro">
          <strong>按一下，看看你今晚最好别干什么。</strong>
        </p>
        <div class="action-row">
          <button class="primary-button" id="readButton" type="button">替我看看 →</button>
          <span class="privacy-note">0 项权限<br>100% 胡说</span>
        </div>
      </div>

      <div class="oracle-wrap">
        <div class="moon" aria-hidden="true"></div>
        <span class="bat bat-one" aria-hidden="true">⌁</span>
        <span class="bat bat-two" aria-hidden="true">⌁</span>
        <article class="card" id="resultCard" aria-live="polite">
          <div class="card-head">
            <span>NO. <span id="resultNumber">000</span></span>
            <span class="signal" id="signalText">等待感应</span>
          </div>
          <p class="result-label">今晚不宜：</p>
          <h2 class="result-title" id="resultTitle">过度<br>相信自己</h2>
          <p class="result-reason" id="resultReason">你今天的自信来路不明，建议先放在门外晾一晚。</p>
          <div class="remedy" id="resultRemedy">幸运补救：吃点热的，少做决定。</div>
          <div class="card-actions">
            <button class="text-button" id="copyButton" type="button">复制这条胡话</button>
            <div class="stamp" aria-hidden="true">仅供<br>娱乐</div>
          </div>
        </article>
      </div>
    </section>

    <footer class="footer">
      <span><strong>不收集隐私</strong>，只收集你的一声冷笑。</span>
      <span>// BUILD_TIME: 2026/10/24 10:50</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status">已复制，转发前请三思</div>

  <script>
    const results = [
      {
        title: "给前任<br>发消息",
        reason: "对方可能没变，只是头像换得比较勤。",
        remedy: "幸运补救：把手机交给一个清醒的人。"
      },
      {
        title: "打开<br>工作群",
        reason: "里面潜伏着一种会在深夜说“简单改一下”的生物。",
        remedy: "幸运补救：开启免打扰，假装已经投胎。"
      },
      {
        title: "照镜子<br>太久",
        reason: "镜子里的那位今晚看起来比你更有主见。",
        remedy: "幸运补救：夸它一句，然后慢慢离开。"
      },
      {
        title: "临时起意<br>剪刘海",
        reason: "你的手很勇敢，但你的额头还没有做好准备。",
        remedy: "幸运补救：放下剪刀，明早再互相伤害。"
      },
      {
        title: "深夜<br>下单",
        reason: "凌晨两点的你和收快递的你不是同一个财务主体。",
        remedy: "幸运补救：先加入购物车，给理智留条活路。"
      },
      {
        title: "说“就喝<br>一杯”",
        reason: "历史资料显示，这句话从未按字面意思发生过。",
        remedy: "幸运补救：提前设置一个体面的闹钟。"
      },
      {
        title: "点开<br>老板语音",
        reason: "超过 20 秒的语音，通常封印着额外工作。",
        remedy: "幸运补救：先喝水，再接受命运。"
      },
      {
        title: "假装<br>很成熟",
        reason: "系统检测到你刚刚还在用被子封印脚外面的鬼。",
        remedy: "幸运补救：允许自己幼稚到午夜十二点。"
      },
      {
        title: "回复<br>“都行”",
        reason: "今晚的“都行”会在半小时后变成“这个不太行”。",
        remedy: "幸运补救：勇敢说出你真正想吃的那一家。"
      },
      {
        title: "制定<br>人生计划",
        reason: "今晚月亮太橙，适合发呆，不适合重启人生。",
        remedy: "幸运补救：先计划明天几点起床。"
      }
    ];

    const readButton = document.querySelector("#readButton");
    const copyButton = document.querySelector("#copyButton");
    const resultCard = document.querySelector("#resultCard");
    const resultNumber = document.querySelector("#resultNumber");
    const signalText = document.querySelector("#signalText");
    const resultTitle = document.querySelector("#resultTitle");
    const resultReason = document.querySelector("#resultReason");
    const resultRemedy = document.querySelector("#resultRemedy");
    const toast = document.querySelector("#toast");
    let currentIndex = -1;
    let toastTimer;

    function readFortune() {
      let nextIndex = currentIndex;

      while (nextIndex === currentIndex) {
        nextIndex = Math.floor(Math.random() * results.length);
      }

      currentIndex = nextIndex;
      const result = results[currentIndex];
      resultCard.classList.remove("is-reading");
      void resultCard.offsetWidth;
      resultCard.classList.add("is-reading");
      signalText.textContent = "正在胡说";
      readButton.disabled = true;

      window.setTimeout(() => {
        resultNumber.textContent = String(Math.floor(Math.random() * 999) + 1).padStart(3, "0");
        resultTitle.innerHTML = result.title;
        resultReason.textContent = result.reason;
        resultRemedy.textContent = result.remedy;
        signalText.textContent = "结果可疑";
        readButton.textContent = "再算一次 →";
        readButton.disabled = false;
      }, 520);
    }

    async function copyResult() {
      const text = `【今晚不宜】${resultTitle.innerText.replace("\n", "")}。${resultReason.textContent} ${resultRemedy.textContent}（结果纯属胡说）`;

      try {
        await navigator.clipboard.writeText(text);
      } catch (error) {
        const input = document.createElement("textarea");
        input.value = text;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }

      window.clearTimeout(toastTimer);
      toast.classList.add("is-visible");
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1800);
    }

    readButton.addEventListener("click", readFortune);
    copyButton.addEventListener("click", copyResult);
  </script>
</body>
</html>
